services:
  db:
    image: postgres:17-alpine
    container_name: cvbuilder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvbuilder
      POSTGRES_USER: cvbuilder
      POSTGRES_PASSWORD: cvbuilder
    ports:
      - "5432:5432"
    volumes:
      - cvbuilder-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvbuilder -d cvbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cvbuilder-data:
